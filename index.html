<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Configuração de viewport para adequar o layout a dispositivos móveis -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dimensionamento de Inversor String</title>
<!-- Estilos da página, mantidos no próprio arquivo para simplificar a distribuição -->
<style>
  /* Fontes do Google Fonts: Inter para o texto e Space Grotesk para os títulos */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap');

  /* Redefine as margens e os espaçamentos internos padrão do navegador */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Variáveis de cor, para facilitar futuras alterações no tema visual */
  :root {
    --bg: #426cf5;
    --bg-deeper: #1a30a0;
    --input-color: #42cbf5;
    --input-text: #0a2030;
    --card-bg: rgba(255,255,255,0.08);
    --card-border: rgba(255,255,255,0.18);
    --text: #ffffff;
    --text-muted: rgba(255,255,255,0.65);
    --accent: #42cbf5;
    --accent-glow: rgba(66,203,245,0.3);
    --result-bg: rgba(66,203,245,0.12);
    --result-border: rgba(66,203,245,0.4);
  }

  /* Fundo azul com dois gradientes radiais sobrepostos */
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(66,203,245,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(26,48,160,0.5) 0%, transparent 55%);
    min-height: 100vh;
    color: var(--text);
    padding: 0 0 60px;
  }

  /* Cabeçalho fixo no topo da página, com efeito de desfoque no fundo */
  header {
    background: rgba(26,48,160,0.55);
    backdrop-filter: blur(12px);
    border-bottom: 1.5px solid rgba(66,203,245,0.25);
    padding: 18px 40px;
    display: flex; align-items: center; justify-content: space-between; gap: 18px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 18px; }
  /* Contêiner do ícone do cabeçalho */
  .header-icon {
    width: 44px; height: 44px; background: var(--accent);
    border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .header-icon svg { width: 26px; height: 26px; }
  .header-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }

  /* Botão importar no header */
  .btn-import {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 18px;
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 10px;
    color: #fff; font-family: 'Space Grotesk', sans-serif;
    font-size: 0.88rem; font-weight: 600; cursor: pointer;
    transition: background 0.18s, border-color 0.18s;
    white-space: nowrap;
  }
  .btn-import:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
  .btn-import svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* Contêiner central, com largura máxima de 900px */
  .main { max-width: 900px; margin: 0 auto; padding: 36px 20px 0; }

  /* Cartões que agrupam os campos de cada seção */
  .card {
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 18px; padding: 30px 32px; margin-bottom: 28px;
    backdrop-filter: blur(6px);
  }
  .card-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.05rem; font-weight: 700; letter-spacing: 0.01em;
    color: var(--accent); margin-bottom: 22px;
    display: flex; align-items: center; gap: 10px;
  }
  .card-title::before {
    content: ''; display: block; width: 4px; height: 20px;
    background: var(--accent); border-radius: 2px; flex-shrink: 0;
  }

  /* Grades de 2 e 3 colunas; em telas pequenas passam a ter uma única coluna */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px 24px; }
  @media(max-width:640px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

  /* Estrutura de cada campo: rótulo acima e entrada de dados abaixo */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 0.78rem; font-weight: 500;
    color: var(--text-muted); letter-spacing: 0.03em; text-transform: uppercase;
  }
  .field input[type="number"] {
    background: var(--input-color);
    border: 2px solid transparent; border-radius: 10px; padding: 10px 14px;
    font-size: 0.95rem; font-family: 'Inter', sans-serif;
    color: #000; font-weight: 600; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    width: 100%; -moz-appearance: textfield;
  }
  .field input[type="number"]::-webkit-outer-spin-button,
  .field input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  /* placeholder em cinza claro, valor preenchido em preto */
  .field input[type="number"]::placeholder { color: #a8d8e8; font-weight: 400; opacity: 1; }
  .field input:focus { border-color: var(--bg-deeper); box-shadow: 0 0 0 3px var(--accent-glow); }
  /* Estilo aplicado ao campo quando a validação identifica alguma inconsistência */
  .field input.input-error {
    background: #ffd6d6 !important; border-color: #d93030 !important;
    box-shadow: 0 0 0 3px rgba(217,48,48,0.25) !important; color: #6b0000 !important;
  }
  /* Caixa somente leitura para exibir valores calculados (utilizada no Voc corrigido) */
  .field .derived {
    background: rgba(66,203,245,0.18); border: 2px solid rgba(66,203,245,0.35);
    color: #e0f8ff; font-weight: 700; border-radius: 10px; padding: 10px 14px;
    font-size: 0.95rem; font-family: 'Inter', sans-serif; cursor: default;
  }

  .divider { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 22px 0; }

  /* Linha do checkbox que indica se os MPPT são iguais */
  .toggle-row { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
  .toggle-row label { font-size: 0.9rem; color: var(--text); cursor: pointer; }
  .toggle-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

  /* Bloco com os campos de especificação de cada MPPT */
  .mppt-block {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
  }
  .mppt-block h4 {
    font-size: 0.88rem; font-weight: 600; color: var(--accent);
    margin-bottom: 14px; letter-spacing: 0.04em; text-transform: uppercase;
  }

  /* BOTÕES PRINCIPAIS */
  .btn-calc {
    display: block; width: 100%; padding: 16px;
    background: var(--accent); color: #0a2a3a; border: none;
    border-radius: 12px; font-family: 'Space Grotesk', sans-serif;
    font-size: 1.05rem; font-weight: 700; letter-spacing: 0.01em;
    cursor: pointer; transition: opacity 0.18s, transform 0.12s, box-shadow 0.18s;
    box-shadow: 0 4px 24px rgba(66,203,245,0.35);
  }
  .btn-calc:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); box-shadow: 0 8px 32px rgba(66,203,245,0.45); }
  .btn-calc:active:not(:disabled) { transform: translateY(0); }
  .btn-calc:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  /* A área de resultados permanece oculta até a execução do cálculo */
  #results { display: none; }

  .results-title {
    font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--accent);
    margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(66,203,245,0.25);
  }

  /* Caixa suspensa conferência */
  .conf-summary {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px; cursor: pointer; user-select: none;
    list-style: none; font-family: 'Space Grotesk', sans-serif;
    font-size: 0.95rem; font-weight: 700; color: var(--accent);
    gap: 12px; transition: background 0.15s; border-radius: 14px;
  }
  .conf-summary::-webkit-details-marker { display: none; }
  .conf-summary:hover { background: rgba(66,203,245,0.06); }
  .conf-arrow { width: 20px; height: 20px; flex-shrink: 0; transition: transform 0.22s ease; color: var(--accent); }
  details[open] .conf-arrow { transform: rotate(180deg); }
  .conf-body { padding: 0 22px 20px; overflow-x: auto; }

  /* Tabela de valores de conferência */
  .check-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .check-table th {
    background: rgba(66,203,245,0.1); color: var(--accent); font-weight: 600;
    padding: 10px 14px; text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .check-table td { padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,0.07); color: var(--text); }
  .check-table tr:last-child td { border-bottom: none; }
  .check-table .val { font-weight: 700; color: #b0f0ff; font-family: 'Space Grotesk', monospace; }

  /* RESULT BOX */
  .result-box {
    border-radius: 14px; padding: 22px 26px; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .result-box.info   { background: var(--result-bg);          border: 1.5px solid var(--result-border); }
  .result-box.orange { background: rgba(255,140,30,0.13);     border: 1.5px solid rgba(255,140,30,0.45); }
  .result-box.green  { background: rgba(80,220,140,0.12);     border: 1.5px solid rgba(80,220,140,0.4); }
  .result-box.block  { flex-direction: column; align-items: stretch; }

  .result-text { flex: 1; min-width: 0; }
  .result-label {
    font-family: 'Space Grotesk', sans-serif; font-size: 1.05rem; font-weight: 700; line-height: 1.35;
    color: var(--text); margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .result-box.orange .result-label { color: #ffb060; border-bottom-color: rgba(255,140,30,0.25); }
  .result-box.green  .result-label { color: #6eedb0; border-bottom-color: rgba(80,220,140,0.25); }
  .result-desc { font-size: 0.79rem; font-weight: 400; color: var(--text-muted); line-height: 1.55; }

  .result-right { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; min-width: 80px; }
  .result-num { font-family: 'Space Grotesk', sans-serif; font-size: 3.2rem; font-weight: 700; line-height: 1; color: var(--accent); }
  .result-box.orange .result-num { color: #ff8c1e; }
  .result-unit { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-top: 5px; }
  .result-box.orange .result-unit { color: rgba(255,140,30,0.65); }

  /* Entradas MPPT hierárquico */
  .mppt-entradas-list { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .mppt-group { display: flex; flex-direction: column; }
  .mppt-group-header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: rgba(80,220,140,0.1); border: 1px solid rgba(80,220,140,0.3);
    border-radius: 10px 10px 0 0; font-family: 'Space Grotesk', sans-serif;
    font-size: 0.88rem; font-weight: 700; color: #6eedb0;
  }
  .mppt-group.single .mppt-group-header { border-radius: 10px; }
  .mppt-entradas-filhos { display: flex; flex-direction: column; }
  .mppt-entrada-filho {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 16px 9px 32px;
    border-left: 1px solid rgba(80,220,140,0.3); border-right: 1px solid rgba(80,220,140,0.3);
    border-bottom: 1px solid rgba(80,220,140,0.15);
    background: rgba(255,255,255,0.04); font-size: 0.86rem; color: var(--text); position: relative;
  }
  .mppt-entrada-filho::before {
    content: ''; position: absolute; left: 16px; top: 50%; width: 10px; height: 1px;
    background: rgba(80,220,140,0.4);
  }
  .mppt-entradas-filhos .mppt-entrada-filho:last-child { border-radius: 0 0 10px 10px; border-bottom: 1px solid rgba(80,220,140,0.3); }
  .entrada-label { color: rgba(255,255,255,0.55); font-size: 0.78rem; font-weight: 600; min-width: 72px; }
  .entrada-val   { font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 700; color: #50dc8c; }
  .entrada-unit  { font-size: 0.72rem; color: rgba(255,255,255,0.4); margin-left: 2px; }

  /* ERROR BANNER */
  .error-banner {
    background: rgba(217,48,48,0.18); border: 1.5px solid rgba(217,48,48,0.5);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 14px;
    font-size: 0.85rem; color: #ffaaaa; display: none;
  }
  .error-banner.visible { display: block; }

</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0a2a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="14" rx="2"/>
        <polyline points="16 3 12 7 8 3"/>
        <line x1="12" y1="12" x2="12" y2="16"/>
        <line x1="10" y1="14" x2="14" y2="14"/>
      </svg>
    </div>
    <div class="header-title">Dimensionamento de Inversor String</div>
  </div>
  <button class="btn-import" onclick="importarDados()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Importar Dados
  </button>
</header>

<!-- input file oculto -->
<input type="file" id="fileInput" accept=".json" style="display:none" onchange="lerArquivo(event)">

<div class="main">

  <!-- MÓDULO -->
  <div class="card">
    <div class="card-title">Dados do Módulo Fotovoltaico</div>
    <!-- Valores obtidos na folha de dados do módulo fotovoltaico -->
    <div class="grid-2">
      <div class="field">
        <label>Tensão de Circuito Aberto — Voc (V)</label>
        <input type="number" id="voc" step="0.01" placeholder="Ex: 45.5" oninput="calcVocCorr(); validarCampos();">
      </div>
      <div class="field">
        <label>Corrente de Curto Circuito — Icc (A)</label>
        <input type="number" id="icc" step="0.01" placeholder="Ex: 10.2" oninput="validarCampos();">
      </div>
      <div class="field">
        <label>Tensão de Máxima Potência — Vmax (V)</label>
        <input type="number" id="vmax" step="0.01" placeholder="Ex: 37.8" oninput="validarCampos();">
      </div>
      <div class="field">
        <label>Corrente de Máxima Potência — Imax (A)</label>
        <input type="number" id="imax" step="0.01" placeholder="Ex: 9.5" oninput="validarCampos();">
      </div>
      <div class="field">
        <label>Potência do Módulo (W)</label>
        <input type="number" id="wmod" step="1" placeholder="Ex: 360">
      </div>
      <div class="field">
        <label>Coeficiente de Temperatura Voc (-%/°C)</label>
        <input type="number" id="coefTemp" step="0.0001" placeholder="Ex: 0.29" oninput="calcVocCorr();">
      </div>
      <div class="field">
        <label>Variação de Temperatura (°C)</label>
        <input type="number" id="deltaTemp" step="0.1" placeholder="Ex: -10" oninput="calcVocCorr();">
      </div>
    </div>
    <hr class="divider">
    <div class="grid-2">
      <div class="field">
        <label>Voc Corrigido pela Temperatura (V)</label>
        <div class="derived" id="vocCorr">—</div>
      </div>
      <div class="field" style="justify-content:flex-end;padding-top:20px;">
        <span style="font-size:0.78rem;color:var(--text-muted);">Voc_corr = Voc + (ΔT × (Coef_Temp/100) × Voc)</span>
      </div>
    </div>
  </div>

  <!-- INVERSOR -->
  <div class="card">
    <div class="card-title">Dados do Inversor</div>
    <div class="grid-2">
      <div class="field">
        <label>Potência Máxima de Entrada CC (W)</label>
        <input type="number" id="pMaxCC" step="1" placeholder="Ex: 8000">
      </div>
      <div class="field">
        <label>Tensão Máxima de Entrada (V)</label>
        <input type="number" id="vMaxEnt" step="0.1" placeholder="Ex: 1000" oninput="validarCampos();">
      </div>
      <div class="field">
        <label>Tensão Máxima da Faixa de Operação (V)</label>
        <input type="number" id="vMaxOp" step="0.1" placeholder="Ex: 800">
      </div>
      <div class="field">
        <label>Tensão de Partida (V)</label>
        <input type="number" id="vPartida" step="0.1" placeholder="Ex: 200" oninput="validarCampos();">
      </div>
      <div class="field">
        <label>Número de MPPT</label>
        <input type="number" id="nMPPT" step="1" min="1" max="10" placeholder="Ex: 2" oninput="renderMPPT()">
      </div>
    </div>
    <hr class="divider">
    <!-- Quando marcado, as mesmas especificações são aplicadas a todos os MPPT -->
    <div class="toggle-row">
      <input type="checkbox" id="mpptIguais" checked onchange="renderMPPT()">
      <label for="mpptIguais">Os MPPT são iguais (mesmas especificações para todos)</label>
    </div>
    <!-- Os campos de cada MPPT são gerados dinamicamente pela função renderMPPT() -->
    <div id="mpptFields"></div>
  </div>

  <!-- Aviso exibido quando a validação dos campos identifica erros -->
  <div class="error-banner" id="errorBanner"></div>

  <button class="btn-calc" id="btnCalc" onclick="calcular()">⚡ Calcular Dimensionamento</button>

  <!-- RESULTADOS -->
  <div id="results" style="margin-top:28px;">
    <div class="card">
      <details id="confDetails">
        <summary class="conf-summary">
          <span>📋 Valores de Conferência</span>
          <svg class="conf-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </summary>
        <div class="conf-body">
          <table class="check-table">
            <thead><tr><th>#</th><th>Descrição</th><th>Cálculo</th><th class="val">Resultado</th></tr></thead>
            <tbody id="confBody"></tbody>
          </table>
        </div>
      </details>
    </div>
    <div class="card">
      <div class="results-title">🎯 Resultados Principais</div>
      <div id="mainResults"></div>
    </div>
  </div>
</div>

<script>
// ── Voc corrigido ─────────────────────────────────────────────────────────────
function calcVocCorr() {
  const voc = parseFloat(document.getElementById('voc').value);
  const coef = parseFloat(document.getElementById('coefTemp').value);
  const delta = parseFloat(document.getElementById('deltaTemp').value);
  const el = document.getElementById('vocCorr');
  // O cálculo é realizado apenas quando os três campos estão preenchidos
  if (!isNaN(voc) && !isNaN(coef) && !isNaN(delta)) {
    // Correção do Voc pela temperatura: Voc + (ΔT × coef/100 × Voc)
    const corr = voc + (delta * (coef / 100) * voc);
    el.textContent = corr.toFixed(4) + ' V';
    el.dataset.val = corr;
  } else { el.textContent = '—'; el.dataset.val = ''; }
}

// ── Validação ─────────────────────────────────────────────────────────────────
function validarCampos() {
  const voc = parseFloat(document.getElementById('voc').value);
  const icc = parseFloat(document.getElementById('icc').value);
  const vmax = parseFloat(document.getElementById('vmax').value);
  const imax = parseFloat(document.getElementById('imax').value);
  const vMaxEnt = parseFloat(document.getElementById('vMaxEnt').value);
  const vPartida = parseFloat(document.getElementById('vPartida').value);
  // Cada regra não atendida destaca os dois campos envolvidos e registra uma mensagem de erro
  const erros = [];
  // O Voc deve ser sempre maior que o Vmax
  const e1 = !isNaN(voc) && !isNaN(vmax) && voc <= vmax;
  setError('voc', e1); setError('vmax', e1);
  if (e1) erros.push('Voc deve ser maior que Vmax.');
  // Regra análoga para a corrente: o Icc deve ser maior que o Imax
  const e2 = !isNaN(icc) && !isNaN(imax) && icc <= imax;
  setError('icc', e2); setError('imax', e2);
  if (e2) erros.push('Icc deve ser maior que Imax.');
  // A tensão máxima de entrada deve ser maior que a tensão de partida
  const e3 = !isNaN(vMaxEnt) && !isNaN(vPartida) && vMaxEnt <= vPartida;
  setError('vMaxEnt', e3); setError('vPartida', e3);
  if (e3) erros.push('Tensão Máxima de Entrada deve ser maior que a Tensão de Partida.');
  // Havendo erros, exibe o aviso e desabilita o botão de cálculo
  const banner = document.getElementById('errorBanner');
  const btn = document.getElementById('btnCalc');
  if (erros.length > 0) {
    banner.innerHTML = '⚠️ <strong>Atenção — corrija os seguintes problemas:</strong><br>' + erros.map(e => '• ' + e).join('<br>');
    banner.classList.add('visible'); btn.disabled = true;
  } else { banner.classList.remove('visible'); btn.disabled = false; }
}

function setError(id, hasError) {
  const el = document.getElementById(id);
  if (!el) return;
  hasError ? el.classList.add('input-error') : el.classList.remove('input-error');
}

// ── Render MPPT ───────────────────────────────────────────────────────────────
function renderMPPT() {
  const n = parseInt(document.getElementById('nMPPT').value) || 0;
  const iguais = document.getElementById('mpptIguais').checked;
  const cont = document.getElementById('mpptFields');
  cont.innerHTML = '';
  if (n < 1) return;
  // Se os MPPT forem iguais, exibe um único bloco; caso contrário, cria um bloco para cada MPPT
  if (iguais) {
    cont.innerHTML = `<div class="mppt-block"><h4>Especificações dos MPPT (todos iguais)</h4><div class="grid-3">
      <div class="field"><label>Corrente Máx. de Entrada por MPPT (A)</label><input type="number" id="iMaxMPPT_0" step="0.01" placeholder="Ex: 12.5"></div>
      <div class="field"><label>Corrente Máx. de Curto por MPPT (A)</label><input type="number" id="iCurtMPPT_0" step="0.01" placeholder="Ex: 15.0"></div>
      <div class="field"><label>Número de Entradas do MPPT</label><input type="number" id="nEntMPPT_0" step="1" min="1" placeholder="Ex: 2"></div>
    </div></div>`;
  } else {
    for (let i = 0; i < n; i++) {
      cont.innerHTML += `<div class="mppt-block"><h4>MPPT ${i+1}</h4><div class="grid-3">
        <div class="field"><label>Corrente Máx. de Entrada (A)</label><input type="number" id="iMaxMPPT_${i}" step="0.01" placeholder="Ex: 12.5"></div>
        <div class="field"><label>Corrente Máx. de Curto (A)</label><input type="number" id="iCurtMPPT_${i}" step="0.01" placeholder="Ex: 15.0"></div>
        <div class="field"><label>Número de Entradas</label><input type="number" id="nEntMPPT_${i}" step="1" min="1" placeholder="Ex: 2"></div>
      </div></div>`;
    }
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
// Funções auxiliares para leitura dos campos (retornam 0 quando estão vazios)
const gv  = id => parseFloat(document.getElementById(id)?.value) || 0;
const gi  = id => parseInt(document.getElementById(id)?.value) || 0;
const flr = v => Math.floor(v);
const cel = v => Math.ceil(v);
// Formata o número; valores NaN ou infinitos são exibidos como traço
function fmtN(v, d = 2) { return isNaN(v) || !isFinite(v) ? '—' : v.toFixed(d); }

// ── Calcular ──────────────────────────────────────────────────────────────────
function calcular() {
  // Leitura dos dados do módulo
  const voc = gv('voc'), icc = gv('icc'), vmax = gv('vmax'), imax = gv('imax');
  const wmod = gv('wmod'), coef = gv('coefTemp'), delta = gv('deltaTemp');
  // Utiliza o Voc corrigido exibido em tela; caso ainda não tenha sido calculado, realiza o cálculo neste ponto
  const vocCorr = parseFloat(document.getElementById('vocCorr').dataset.val) || (voc + (delta * (coef / 100) * voc));
  document.getElementById('vocCorr').textContent = vocCorr.toFixed(4) + ' V';
  document.getElementById('vocCorr').dataset.val = vocCorr;

  // Leitura dos dados do inversor
  const pMaxCC = gv('pMaxCC'), vMaxEnt = gv('vMaxEnt'), vMaxOp = gv('vMaxOp');
  const vPartida = gv('vPartida'), nMPPT = gi('nMPPT') || 1;
  const iguais = document.getElementById('mpptIguais').checked;

  // Impede o cálculo caso algum campo obrigatório esteja vazio
  if (!voc || !icc || !vmax || !imax || !wmod || !pMaxCC || !vMaxEnt || !vMaxOp || !vPartida) {
    alert('Preencha todos os campos obrigatórios antes de calcular.'); return;
  }

  // Cálculos 1 a 4: limites de módulos por potência e por tensão
  const calc1 = pMaxCC / wmod;
  const calc2 = vMaxEnt / vocCorr;
  const calc3 = vMaxOp / vocCorr;
  const calc4 = vPartida / vmax;
  // Os valores máximos são arredondados para baixo e o mínimo para cima, por segurança
  const maxModPot  = flr(calc1);
  const maxModMPPT = flr(Math.min(calc2, calc3));
  const minModMPPT = cel(calc4);

  // Cálculos 5 e 6: limites de corrente, realizados separadamente para cada MPPT
  const mpptData = [];
  for (let i = 0; i < nMPPT; i++) {
    // Se os MPPT forem iguais, todos utilizam os campos do primeiro (índice 0)
    const idx = iguais ? 0 : i;
    const iMaxM = parseFloat(document.getElementById(`iMaxMPPT_${idx}`)?.value) || 0;
    const iCutM = parseFloat(document.getElementById(`iCurtMPPT_${idx}`)?.value) || 0;
    const nEnt  = parseInt(document.getElementById(`nEntMPPT_${idx}`)?.value) || 1;
    const calc5 = imax > 0 ? iMaxM / imax : NaN;
    const calc6 = icc  > 0 ? iCutM / icc  : NaN;
    // Adota-se o menor valor entre os cálculos 5 e 6, limitado ao número de entradas do MPPT
    const menorRatio = Math.min(isNaN(calc5) ? Infinity : calc5, isNaN(calc6) ? Infinity : calc6);
    const entradasUtil = isFinite(menorRatio) ? Math.min(flr(menorRatio), nEnt) : nEnt;
    mpptData.push({ label: `MPPT ${i+1}`, iMaxM, iCutM, nEnt, calc5, calc6, entradasUtil });
  }

  // Tabela conferência
  let rows = `
    <tr><td>1</td><td>Potência máx. CC ÷ Potência do módulo</td><td>${pMaxCC} ÷ ${wmod}</td><td class="val">${fmtN(calc1)}</td></tr>
    <tr><td>2</td><td>Tensão máx. de entrada ÷ Voc corrigido</td><td>${fmtN(vMaxEnt,1)} ÷ ${fmtN(vocCorr,4)}</td><td class="val">${fmtN(calc2)}</td></tr>
    <tr><td>3</td><td>Tensão máx. faixa de operação ÷ Voc corrigido</td><td>${fmtN(vMaxOp,1)} ÷ ${fmtN(vocCorr,4)}</td><td class="val">${fmtN(calc3)}</td></tr>
    <tr><td>4</td><td>Tensão de partida ÷ Vmax</td><td>${fmtN(vPartida,1)} ÷ ${fmtN(vmax,2)}</td><td class="val">${fmtN(calc4)}</td></tr>`;
  mpptData.forEach(m => {
    rows += `
    <tr><td>5 (${m.label})</td><td>Corrente Máx. Entrada MPPT ÷ Imax módulo</td><td>${fmtN(m.iMaxM,2)} ÷ ${fmtN(imax,2)}</td><td class="val">${fmtN(m.calc5)}</td></tr>
    <tr><td>6 (${m.label})</td><td>Corrente Máx. Curto MPPT ÷ Icc módulo</td><td>${fmtN(m.iCutM,2)} ÷ ${fmtN(icc,2)}</td><td class="val">${fmtN(m.calc6)}</td></tr>`;
  });
  document.getElementById('confBody').innerHTML = rows;

  // Resultados principais
  let html = `
    <div class="result-box info">
      <div class="result-text">
        <div class="result-label">Quantidade máxima de módulos de acordo com a potência total</div>
        <div class="result-desc">Potência máx. CC (${pMaxCC} W) ÷ Potência do módulo (${wmod} W) = ${fmtN(calc1)} → arredondado para baixo</div>
      </div>
      <div class="result-right"><div class="result-num">${maxModPot}</div><div class="result-unit">módulos</div></div>
    </div>
    <div class="result-box orange">
      <div class="result-text">
        <div class="result-label">Quantidade mínima de módulos por MPPT de acordo com a tensão de partida</div>
        <div class="result-desc">Tensão de partida (${fmtN(vPartida,1)} V) ÷ Vmax (${fmtN(vmax,2)} V) = ${fmtN(calc4)} → arredondado para cima</div>
      </div>
      <div class="result-right"><div class="result-num">${minModMPPT}</div><div class="result-unit">módulos</div></div>
    </div>`;

  // Se algum MPPT possuir mais de uma entrada, cada entrada é exibida separadamente; caso contrário, exibe-se uma linha por MPPT
  const algumComMaisDeUma = mpptData.some(m => m.nEnt > 1);
  let listaEntradas = '';
  mpptData.forEach(m => {
    if (algumComMaisDeUma) {
      let filhos = '';
      for (let e = 1; e <= m.entradasUtil; e++) {
        filhos += `<div class="mppt-entrada-filho">
          <span class="entrada-label">Entrada ${e}:</span>
          <span class="entrada-val">${maxModMPPT}</span>
          <span class="entrada-unit">módulos</span>
        </div>`;
      }
      listaEntradas += `<div class="mppt-group">
        <div class="mppt-group-header">${m.label}</div>
        <div class="mppt-entradas-filhos">${filhos}</div>
      </div>`;
    } else {
      listaEntradas += `<div class="mppt-group single">
        <div class="mppt-group-header">${m.label} —
          <span style="color:#fff;font-size:1.05rem;margin-left:4px;">${maxModMPPT}</span>
          <span style="font-size:0.78rem;font-weight:400;color:rgba(255,255,255,0.55);margin-left:4px;">módulos</span>
        </div>
      </div>`;
    }
  });
  html += `<div class="result-box green block">
    <div class="result-text">
      <div class="result-label">Quantidade máxima de módulos por MPPT</div>
      <div class="result-desc">Menor valor entre cálculos 5 e 6 de cada MPPT, arredondado para baixo</div>
    </div>
    <div class="mppt-entradas-list">${listaEntradas}</div>
  </div>`;

  // Insere os resultados na página
  document.getElementById('mainResults').innerHTML = html;
  // Exibe a área de resultados
  document.getElementById('results').style.display = 'block';
  // Rola a página suavemente até os resultados
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Init
renderMPPT();
</script>
</body>
</html>
